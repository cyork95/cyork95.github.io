<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>York Develops — Blog</title>
  <meta name="description" content="Technical writing on cloud engineering, data pipelines, and building things that actually work. By Cody York." />

  <meta property="og:title" content="York Develops — Blog" />
  <meta property="og:description" content="Technical writing on cloud engineering, data pipelines, and building things that actually work." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://yorkdevelops.com/blog/" />

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="/js/site-chrome.js"></script>
  <script src="/js/main.js"></script>
</head>
<body>

  <!-- ─── Header ─────────────────────────────────────────────── -->
  <div id="site-nav"></div>

  <!-- ─── Main ───────────────────────────────────────────────── -->
  <main>
    <div class="container">

      <section class="blog-hero">
        <p class="blog-hero-label">// writing</p>
        <h1 class="blog-hero-title">Notes from the stack</h1>
        <p class="blog-hero-tagline">
          Technical writing on cloud engineering, data pipelines, and the tools I build in between.
          No jargon. No hype. Just the stuff that worked.
        </p>
      </section>

      <div class="section-tabs" id="section-tabs" role="tablist" aria-label="Filter posts by section">
        <button class="section-tab active" data-section="all"              role="tab" aria-selected="true">All</button>
        <button class="section-tab"        data-section="programming"      role="tab" aria-selected="false">Programming</button>
        <button class="section-tab"        data-section="creative-writing" role="tab" aria-selected="false">Creative Writing</button>
        <button class="section-tab"        data-section="fun"              role="tab" aria-selected="false">Fun</button>
        <button class="section-tab"        data-section="tea-garden"       role="tab" aria-selected="false">Tea &amp; Garden</button>
      </div>

      <!-- ─── Search ──────────────────────────────────────────────── -->
      <div class="search-container">
        <div class="search-wrapper">
          <span class="search-label">// search:</span>
          <input type="text" id="search-input" placeholder="Search by tag, title, or content..." aria-label="Search posts" autocomplete="off" />
          <button id="search-clear" class="search-clear-btn" aria-label="Clear search" type="button" style="display: none;">clear</button>
        </div>
        <div class="search-info" id="search-info" style="display: none;">
          <span class="search-count" id="search-count">0 posts found</span>
          <span class="search-indexing" id="search-indexing" style="display: none;">// indexing full text...</span>
        </div>
      </div>

      <p class="posts-section-label" id="section-heading">All Posts</p>
      <div id="post-list">
        <p class="loading">Loading posts…</p>
      </div>

    </div>
  </main>

  <!-- ─── Footer ─────────────────────────────────────────────── -->
  <div id="site-footer"></div>

  <script src="main.js" defer></script>
</body>
</html>
